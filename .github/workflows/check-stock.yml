name: Check Amul Lassi Stock

on:
  schedule:
    # every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated status.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.47.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Check stock (real browser render) and notify
        env:
          NTFY_TOPIC: amul-lassi-ir-f3f4ec47
        run: node check.js

      - name: Commit status if changed
        run: |
          if [ "$(cat CHANGED_FLAG 2>/dev/null)" = "1" ]; then
            rm -f CHANGED_FLAG
            git config user.name "amul-stock-bot"
            git config user.email "actions@github.com"
            git add status.txt
            git commit -m "status update ($(date -u +%FT%TZ))"
            git push
          else
            rm -f CHANGED_FLAG
            echo "No status change."
          fi
