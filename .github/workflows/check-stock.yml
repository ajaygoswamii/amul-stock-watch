name: Check Amul Lassi Stock

on:
  schedule:
    # every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated status.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check stock and notify
        env:
          NTFY_TOPIC: amul-lassi-ir-f3f4ec47
        run: |
          set -e

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          # key|label|url  — add more lines here to watch more products
          PRODUCTS='
          LASSI_PLAIN|Amul High Protein Plain Lassi (Pack of 30)|https://shop.amul.com/en/product/amul-high-protein-plain-lassi-200-ml-or-pack-of-30
          LASSI_ROSE|Amul High Protein Rose Lassi (Pack of 30)|https://shop.amul.com/en/product/amul-high-protein-rose-lassi-200-ml-or-pack-of-30
          '

          touch status.txt
          CHANGED=0

          while IFS='|' read -r KEY LABEL URL; do
            [ -z "$KEY" ] && continue

            PREV_STATUS=$(grep "^${KEY}=" status.txt | cut -d= -f2)
            [ -z "$PREV_STATUS" ] && PREV_STATUS="OUT"

            HTTP_CODE=$(curl -sL -o /tmp/page.html -w "%{http_code}" -A "$UA" "$URL" || echo "000")
            HTML=$(cat /tmp/page.html 2>/dev/null || true)
            LEN=${#HTML}

            echo "$LABEL: http=$HTTP_CODE len=$LEN"

            if [ "$HTTP_CODE" != "200" ] || [ "$LEN" -lt 1000 ]; then
              echo "$LABEL: fetch looked invalid (http=$HTTP_CODE, len=$LEN) — skipping this cycle, keeping status $PREV_STATUS."
              continue
            fi

            HAS_SOLDOUT=0
            echo "$HTML" | grep -qi "sold out" && HAS_SOLDOUT=1

            HAS_ADDCART=0
            echo "$HTML" | grep -qiE "add to cart|add-to-cart|addtocart" && HAS_ADDCART=1

            echo "$LABEL: sold_out_marker=$HAS_SOLDOUT add_to_cart_marker=$HAS_ADDCART"

            if [ "$HAS_SOLDOUT" = "1" ]; then
              NEW_STATUS="OUT"
            elif [ "$HAS_ADDCART" = "1" ]; then
              NEW_STATUS="IN"
            else
              echo "$LABEL: ambiguous page content (neither marker found) — keeping previous status ($PREV_STATUS) to avoid a false alert."
              NEW_STATUS="$PREV_STATUS"
            fi

            echo "$LABEL — previous: $PREV_STATUS, new: $NEW_STATUS"

            if [ "$NEW_STATUS" = "IN" ] && [ "$PREV_STATUS" != "IN" ]; then
              echo "$LABEL went IN STOCK — sending notification."
              curl -sS \
                -H "Title: $LABEL IN STOCK" \
                -H "Priority: urgent" \
                -H "Tags: rotating_light" \
                -d "$LABEL is in stock. Buy now: $URL" \
                "https://ntfy.sh/$NTFY_TOPIC"
            fi

            if [ "$NEW_STATUS" != "$PREV_STATUS" ]; then
              if grep -q "^${KEY}=" status.txt; then
                sed -i "s/^${KEY}=.*/${KEY}=${NEW_STATUS}/" status.txt
              else
                echo "${KEY}=${NEW_STATUS}" >> status.txt
              fi
              CHANGED=1
            fi
          done <<< "$PRODUCTS"

          if [ "$CHANGED" = "1" ]; then
            git config user.name "amul-stock-bot"
            git config user.email "actions@github.com"
            git add status.txt
            git commit -m "status update ($(date -u +%FT%TZ))"
            git push
          fi
