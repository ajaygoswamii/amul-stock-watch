name: Check Amul Lassi Stock

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Debug fetch
        run: |
          curl -sL -D /tmp/headers.txt -o /tmp/page.html -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" "https://shop.amul.com/en/product/amul-high-protein-plain-lassi-200-ml-or-pack-of-30"
          echo "--- HEADERS ---"
          cat /tmp/headers.txt
          echo "--- LENGTH ---"
          wc -c /tmp/page.html
          echo "--- SNIPPET ---"
          head -c 1500 /tmp/page.html
